<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101925">
  <title>ByteBack | Give a device. Open a door.</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
  <script src="qr.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="workspace">
  <a class="skip-link" href="#app-content">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="index.html"><img src="assets/favicon.svg" width="34" height="34" alt=""><span>BYU <strong>ByteBack</strong><span class="brand-dot">.</span></span></a>
    <nav aria-label="App navigation">
      <a href="#donate" data-route="donate">Donate a device</a>
      <a href="#catalog" data-route="catalog">Find a computer</a>
      <a href="#orders" data-route="orders">My dashboard</a>
    </nav>
    <button id="account" class="button button-small" type="button">Sign in</button>
  </header>
  <div id="mode-banner" class="mode-banner">Connecting to ByteBack…</div>
  <main id="app-content" class="app-container" tabindex="-1">
    <div id="notice" class="app-notice" role="status" hidden></div>
    <div id="error" class="app-error" role="alert" hidden></div>
    <div id="view"><p class="loading">Loading your next chapter…</p></div>
    <noscript><p>This app needs JavaScript. Enable it to donate, reserve a computer, and manage orders.</p></noscript>
  </main>
  <footer class="app-footer"><span>A student idea. A shared purpose.</span><p>Independent academic project. Not affiliated with, sponsored by, or endorsed by Brigham Young University.</p><a href="index.html">About ByteBack ↗</a></footer>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div><button class="close-modal" type="button" aria-label="Close dialog">×</button></dialog>
  <div id="print-area"></div>
</body>
</html>
